<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 工廠模擬器 - v12.0.8 響應式優化版</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Share+Tech+Mono&display=swap');
        
        body { 
            background: #0d1117; 
            color: #c9d1d9;      
            font-family: 'Noto Sans TC', sans-serif; 
            user-select: none;   
            margin: 0;           
            padding: 10px;       
        }
        
        /* 儀表板：允許換行 */
        .dashboard { 
            display: flex;             
            flex-wrap: wrap;
            justify-content: center; 
            max-width: 1100px;         
            position: sticky;          
            top: 0;                    
            margin: 0 auto 10px auto;  
            background: #21262d;       
            padding: 10px;             
            border-radius: 12px;       
            border: 1px solid #30363d; 
            z-index: 1000;             
            align-items: center;
            gap: 10px;
        }

        .stat-box { min-width: 80px; text-align: center; }
        .stat-value { font-family: 'Share Tech Mono'; font-size: 18px; color: #58a6ff; }
        .stat-label { font-size: 11px; color: #8b949e; }

		.prestige-container { 
			display: flex; flex-direction: column; 
			background: linear-gradient(145deg, #161b22, #0d1117); 
			padding: 8px 15px; border-radius: 10px; border: 1px solid #484f58; 
			cursor: pointer; transition: 0.3s; flex: 1 1 200px;
		}
		.prestige-container:hover { border-color: #58a6ff; }
		.prestige-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
		.prestige-badge { font-weight: 800; font-size: 13px; padding: 2px 8px; border-radius: 4px; }

		/* 稱號顏色保持不變 */
		.rank-1 { color: #8b949e; border: 1px solid #484f58; }
		.rank-2 { color: #3fb950; border: 1px solid #238636; }
		.rank-10 { background: linear-gradient(45deg, #ffd700, #ff00ff); color: #fff; animation: rainbow 3s infinite; } 
		@keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

		/* 彈窗 */
		.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 5000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
		.modal-content { background: #161b22; width: 90%; max-width: 550px; padding: 20px; border-radius: 16px; border: 1px solid #30363d; max-height: 90vh; overflow-y: auto; }
		.prestige-item { display: grid; grid-template-columns: 1.2fr 0.8fr 0.6fr 0.6fr 0.6fr; padding: 10px; font-size: 10px; align-items: center; text-align: center; border-bottom: 1px solid #21262d; }

		/* 工廠區：改為自適應寬度 */
		.factory-floor { 
            max-width: 1100px; 
            margin: 10px auto; 
            background: #161b22; 
            border: 2px solid #30363d; 
            border-radius: 16px; 
            padding: 10px;
        }

		.line-group { 
            position: relative; 
            display: flex;
            flex-wrap: wrap; /* 關鍵：螢幕小時自動換行 */
            gap: 15px;
            padding: 40px 10px 20px 10px;
            border-bottom: 2px solid #21262d; 
            justify-content: center;
        }

		.line-label { position: absolute; left: 12px; top: 12px; font-size: 11px; color: #8b949e; font-weight: bold; }
		
        .station { 
            position: relative; /* 移除絕對定位 */
            width: 100%;
            max-width: 250px; /* 限制寬度 */
            min-height: 160px;
            background: rgba(48, 54, 61, 0.2); 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            flex: 1 1 220px; /* 讓它在空間足夠時並排，不足時撐滿 */
        }

		/* 零件動畫：改為根據父級容器定位 */
		.part { 
            position: absolute; 
            width: 30px; height: 30px; 
            border-radius: 8px; 
            z-index: 100; 
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 11px; font-weight: bold; color: #fff; 
            pointer-events: none; /* 防止遮擋點擊 */
        }

		/* 底部 UI */
		.bottom-ui { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 15px; 
            max-width: 1100px; 
            margin: 20px auto; 
        }
		.panel-box { background: #161b22; padding: 15px; border-radius: 12px; border: 1px solid #30363d; }
		.log-container { background: #0d1117; height: 120px; overflow-y: auto; border: 1px solid #30363d; padding: 10px; font-family: 'Share Tech Mono'; font-size: 11px; color: #3fb950; border-radius: 8px; }

        /* 其他通用組件保持不變 */
        .order-container { flex-grow: 1; display: flex; flex-direction: column; gap: 3px; overflow: hidden; margin-bottom: 5px; }
        .order-card { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
        .order-card.selected { border-color: #3fb950; background: #132316; }
		.action-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.1s; font-size: 12px; }
		.btn-green { background: #238636; }
		.btn-blue { background: #1f6feb; }
        .durability-box { width: 100%; height: 6px; background: #0d1117; border-radius: 3px; margin: 5px 0; overflow: hidden; }
        .dur-fill { height: 100%; background: #3fb950; transition: 0.3s; }
        .progress-container { width: 100%; height: 6px; background: #0d1117; visibility: hidden; border-radius: 3px; margin: 5px 0; }
        .progress-bar { width: 100%; height: 100%; background: #8957e5; }
        .locked-line { position: absolute; inset: 0; background: rgba(13, 23, 13, 0.95); z-index: 200; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); border-radius: 16px; }
        .admin-input { width: 50px; background: #0d1117; border: 1px solid #30363d; color: #58a6ff; text-align: center; }
    </style>
</head>
<body>

<div id="prestige-modal" class="modal-overlay" onclick="if(event.target==this) togglePrestigeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 style="color:#58a6ff; text-align:center; margin-top:0;">🏆 產業聲望階級</h2>
        <div id="prestige-list-container" class="prestige-list"></div>
        <button class="action-btn btn-blue" style="margin-top:20px" onclick="togglePrestigeModal()">返回工廠</button>
    </div>
</div>

<div id="admin-panel" class="modal-overlay">
    <div class="modal-content" style="border-color:#58a6ff">
        <h3 style="color:#58a6ff; text-align:center;">⚙️ 系統管理</h3>        
        <div id="admin-prestige-settings"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <button class="action-btn btn-blue" onclick="inject('money', 10000)">💰 資金 +1萬</button>
            <button class="action-btn btn-red" onclick="resetGame()">⚠️ 重置數據</button>
            <button class="action-btn btn-blue" style="background:#30363d" onclick="toggleAdmin()">返回</button>
        </div>
    </div>
</div>

<div class="dashboard">
    <div class="prestige-container" onclick="secretTrigger()">
        <div class="prestige-header">
            <span id="prestige-badge" class="prestige-badge rank-1">載入中</span>
            <span id="prestige-bonus-summary" style="font-family:'Share Tech Mono'; color:#3fb950; font-size:10px;">Bonus...</span>
        </div>
        <div style="height:4px; background:#30363d; border-radius:2px; overflow:hidden;">
            <div id="dashboard-prestige-bar" style="height:100%; background:#58a6ff; width:0%;"></div>
        </div>
    </div>
    <div class="stat-box"><div class="stat-label">💰 資金</div><div id="money-val" class="stat-value">$0</div></div>
    <div class="stat-box"><div class="stat-label">🪵 木材</div><div id="wood-val" class="stat-value">0</div></div>
    <div class="stat-box"><div class="stat-label">🪨 石頭</div><div id="stone-val" class="stat-value">0</div></div>
    <div class="stat-box"><div class="stat-label">⛓️ 鋼鐵</div><div id="iron-val" class="stat-value">0</div></div>
    <div class="stat-box"><div class="stat-label">🔋 核心</div><div id="core-val" class="stat-value">0</div></div>
    <button class="action-btn btn-green" style="width:80px" onclick="toggleAdmin()">⚙️ 設定</button>
</div>

<div class="factory-floor" id="floor">
    <div id="lines-container"></div>
</div>

<div class="bottom-ui">
    <div class="panel-box">
        <b style="color:#58a6ff;">🛒 物資採購</b>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:5px;">
            <button class="action-btn btn-blue" onclick="buy('wood')">木材 $<span id="btn-p-wood">5</span></button>
            <button class="action-btn btn-blue" onclick="buy('stone')">石頭 $<span id="btn-p-stone">10</span></button>
            <button class="action-btn btn-blue" onclick="buy('iron')">鋼鐵 $<span id="btn-p-iron">15</span></button>
            <button class="action-btn btn-blue" onclick="buy('core')">核心 $<span id="btn-p-core">50</span></button>
        </div>
    </div>
    <div class="panel-box">
        <b style="color:#bc8cff;">🤖 自動化部署</b>
        <div id="auto-controls" style="display:grid; grid-template-columns: 1fr; gap:5px; margin-top:5px;"></div>
    </div>
    <div class="panel-box">
        <b style="color:#3fb950;">📝 系統日誌</b>
        <div id="log" class="log-container"></div>
    </div>
</div>

<script>
    // 遊戲配置與原代碼邏輯相同，僅修改 UI 互動部分
    let PRESTIGE_LEVELS = [
        { lv: 1,  name: "🌱 初出茅廬", min: 0,          bonus: 0,    speed: 0,    qa: 0,    class: "rank-1" },
        { lv: 2,  name: "⚒️ 潛力新人", min: 5000,       bonus: 0.05, speed: 0.05, qa: 0.02, class: "rank-2" },
        { lv: 3,  name: "🔧 熟練工匠", min: 20000,      bonus: 0.10, speed: 0.10, qa: 0.04, class: "rank-3" },
        { lv: 4,  name: "🚛 地區供應", min: 100000,     bonus: 0.15, speed: 0.15, qa: 0.06, class: "rank-4" },
        { lv: 5,  name: "🏭 產業支柱", min: 500000,     bonus: 0.25, speed: 0.20, qa: 0.08, class: "rank-5" },
        { lv: 6,  name: "💰 貿易大亨", min: 2000000,    bonus: 0.40, speed: 0.25, qa: 0.10, class: "rank-6" },
        { lv: 10, name: "🌌 星際造物", min: 1000000000, bonus: 2.00, speed: 0.60, qa: 0.25, class: "rank-10" }
    ];

    const LINE_CONFIGS = { 1:{u:0, m:1.0, n:"01"}, 2:{u:500, m:1.2, n:"02"}, 3:{u:10000, m:1.5, n:"03"}, 4:{u:50000, m:2.0, n:"04"}, 5:{u:100000, m:3.0, n:"05"} };
    let cfg = { wood: { n: '木材', c: 'part-wood', r: 15, buy: 5 }, stone: { n: '石頭', c: 'part-stone', r: 30, buy: 10 }, iron: { n: '鋼鐵', c: 'part-iron', r: 55, buy: 15 }, core: { n: '核心', c: 'part-core', r: 150, buy: 50 } };

    let game = { money: 100, inv: { wood: 0, stone: 0, iron: 0, core: 0 }, unlocked: { 1: true, 2: false, 3: false, 4: false, 5: false }, lines: {}, adminClicks: 0 };
    let currentPrestige = PRESTIGE_LEVELS[0];

    for(let i=1; i<=5; i++) { game.lines[i] = { lv: 0, dur: 100, isAuto: false, hasAuto: false, proc: false, selIdx: -1, orders: [] }; }

    function addLog(m, c='#3fb950') { 
        const log = document.getElementById('log'); if(!log) return;
        const d = document.createElement('div'); d.style.color = c; d.innerHTML = `[${new Date().toLocaleTimeString()}] > ${m}`;
        log.prepend(d); if(log.childNodes.length > 30) log.lastChild.remove();
    }

    function updatePrestige() {
        let matched = PRESTIGE_LEVELS[0];
        for (let i = PRESTIGE_LEVELS.length - 1; i >= 0; i--) { if (game.money >= PRESTIGE_LEVELS[i].min) { matched = PRESTIGE_LEVELS[i]; break; } }
        if (currentPrestige.lv !== matched.lv) { addLog(`🏆 晉升！【${matched.name}】`, "#f2cc60"); currentPrestige = matched; }
        document.getElementById('prestige-badge').innerText = matched.name;
        document.getElementById('prestige-badge').className = `prestige-badge ${matched.class}`;
        document.getElementById('prestige-bonus-summary').innerText = `利潤:+${(matched.bonus*100).toFixed(0)}% 速度:+${(matched.speed*100).toFixed(0)}%`;
    }

    function initFloor() {
        const container = document.getElementById('lines-container'); container.innerHTML = '';
        const autoControls = document.getElementById('auto-controls'); autoControls.innerHTML = '';
        for(let i=1; i<=5; i++) {
            container.innerHTML += `
                <div class="line-group" id="line-group-${i}">
                    <div class="line-label">Line ${LINE_CONFIGS[i].n} (x${LINE_CONFIGS[i].m.toFixed(1)})</div>
                    <div id="lock-${i}" class="locked-line" style="${game.unlocked[i]?'display:none':''}">
                        <button class="action-btn btn-green" style="width:140px" onclick="unlockLine(${i})">支付 $${LINE_CONFIGS[i].u} 解鎖</button>
                    </div>
                    <div class="station">
                        <div style="color:#f2cc60; font-weight:bold; margin-bottom:5px">📦 訂單</div>
                        <div id="order-list-${i}" class="order-container"></div>
                        <button id="deliver-btn-${i}" class="action-btn btn-green" onclick="processOrder(${i})" disabled>交付</button>
                    </div>
                    <div class="station">
                        <div style="font-weight:bold">⚙️ 加工 <span id="lv-tag-${i}" style="color:#bc8cff">Lv.0</span></div>
                        <div class="durability-box"><div id="dur-fill-${i}" class="dur-fill"></div></div>
                        <div class="progress-container" id="prog-cont-${i}"><div class="progress-bar" id="prog-bar-${i}"></div></div>
                        <div style="display:flex; gap:5px; margin-top:auto">
                            <button id="up-btn-${i}" class="action-btn btn-blue" onclick="upgradeLine(${i})">升級 $<span id="up-cost-${i}">0</span></button>
                            <button id="repair-btn-${i}" class="action-btn btn-red" onclick="repair(${i})">保養</button>
                        </div>
                    </div>
                    <div class="station" style="justify-content:center; align-items:center">
                        <div id="qa-status-${i}" style="font-weight:bold; color:#8b949e">🔍 待機</div>
                    </div>
                    <div class="station" style="border-style:dashed; justify-content:center; align-items:center">
                        <div id="delivery-info-${i}" style="font-size:11px; text-align:center">🏁 等待產品</div>
                    </div>
                </div>
            `;
            autoControls.innerHTML += `<button id="auto-btn-${i}" class="action-btn" style="background:#30363d" onclick="toggleAuto(${i})">部署 Line ${i} 自動化</button>`;
        }
    }

    // 核心動畫邏輯修改：動態計算位置
    async function runPart(lId, type, idx) {
        const lineGroup = document.getElementById(`line-group-${lId}`);
        const stations = lineGroup.getElementsByClassName('station');
        const part = document.createElement('div');
        part.className = `part ${cfg[type].c}`;
        part.innerText = idx;
        lineGroup.appendChild(part);

        const moveTo = (sIdx) => {
            const target = stations[sIdx];
            // 計算目標工作站中心點相對於父容器的位置
            const x = target.offsetLeft + (target.offsetWidth / 2) - 15;
            const y = target.offsetTop + (target.offsetHeight / 2) - 15;
            part.style.left = `${x}px`;
            part.style.top = `${y}px`;
        };

        moveTo(0); // 從訂單區出發
        await new Promise(r => setTimeout(r, 100));

        while(true) {
            moveTo(1); // 到加工區
            let timeSec = Math.max(0.5, (15 - game.lines[lId].lv * 1.3) * (1 - currentPrestige.speed));
            const bar = document.getElementById(`prog-bar-${lId}`);
            document.getElementById(`prog-cont-${lId}`).style.visibility = 'visible';
            bar.style.transition = 'none'; bar.style.width = '100%'; void bar.offsetWidth;
            bar.style.transition = `width ${timeSec}s linear`; bar.style.width = '0%';
            await new Promise(r => setTimeout(r, timeSec * 1000));
            document.getElementById(`prog-cont-${lId}`).style.visibility = 'hidden';

            moveTo(2); // 到檢測區
            document.getElementById(`qa-status-${lId}`).innerText = "⚙️ 檢測中";
            await new Promise(r => setTimeout(r, 600));

            let failChance = Math.max(0, (0.05 + (100 - game.lines[lId].dur)/200) - currentPrestige.qa);
            if(Math.random() < failChance) {
                document.getElementById(`qa-status-${lId}`).innerText = "❌ 失敗";
                await new Promise(r => setTimeout(r, 500));
            } else {
                document.getElementById(`qa-status-${lId}`).innerText = "✅ 合格";
                moveTo(3); // 到物流區
                await new Promise(r => setTimeout(r, 600));
                return part;
            }
        }
    }

    async function processOrder(id) {
        const l = game.lines[id]; if(l.proc || l.selIdx === -1) return;
        const o = l.orders[l.selIdx];
        l.proc = true; game.inv[o.type] -= o.qty; updateUI();
        const parts = [];
        for(let i=1; i<=o.qty; i++) {
            const p = await runPart(id, o.type, i);
            parts.push(p); l.dur = Math.max(0, l.dur - 2); updateUI();
        }
        setTimeout(() => {
            parts.forEach(p => p.remove());
            const profit = Math.floor(o.qty * cfg[o.type].r * LINE_CONFIGS[id].m * (1 + currentPrestige.bonus));
            game.money += profit;
            document.getElementById(`delivery-info-${id}`).innerHTML = `<b style="color:#3fb950">✅ 完成!</b><br>+$${profit}`;
            genOrders(id); l.proc = false; l.selIdx = -1; updateUI();
        }, 500);
    }

    function updateUI() {
        updatePrestige();
        document.getElementById('money-val').innerText = `$${Math.floor(game.money).toLocaleString()}`;
        ['wood','stone','iron','core'].forEach(t => {
            document.getElementById(`${t}-val`).innerText = game.inv[t];
            document.getElementById(`btn-p-${t}`).innerText = cfg[t].buy;
        });
        for(let i=1; i<=5; i++) {
            const l = game.lines[i];
            if(game.unlocked[i]) {
                document.getElementById(`lv-tag-${i}`).innerText = `Lv.${l.lv}`;
                document.getElementById(`up-cost-${i}`).innerText = Math.floor((l.lv + 1) * 400 * (l.lv + 1.2));
                document.getElementById(`dur-fill-${i}`).style.width = `${l.dur}%`;
                const ab = document.getElementById(`auto-btn-${i}`);
                if(l.hasAuto) { ab.innerText = l.isAuto ? `🤖 L${i}: 運行` : `🤖 L${i}: 停止`; ab.style.background = l.isAuto ? "#238636" : "#d29922"; }
                else { ab.innerText = `購買 L${i} 自動化 $500`; ab.disabled = game.money < 500; }
                if(!l.orders.length) genOrders(i); renderOrders(i);
                const deliverBtn = document.getElementById(`deliver-btn-${i}`);
                if (l.selIdx !== -1) {
                    const o = l.orders[l.selIdx]; const can = game.inv[o.type] >= o.qty;
                    deliverBtn.innerText = can ? `交付 ${o.qty}x` : `缺少材料`;
                    deliverBtn.disabled = !can || l.proc;
                }
            }
        }
    }

    // 其他邏輯函數保持不變
    function buy(t) { if(game.money >= cfg[t].buy) { game.money -= cfg[t].buy; game.inv[t]++; updateUI(); } }
    function unlockLine(id) { if (game.money >= LINE_CONFIGS[id].u) { game.money -= LINE_CONFIGS[id].u; game.unlocked[id] = true; updateUI(); } }
    function upgradeLine(id) { const c = Math.floor((game.lines[id].lv + 1) * 400 * (game.lines[id].lv + 1.2)); if(game.money >= c) { game.money -= c; game.lines[id].lv++; updateUI(); } }
    function repair(id) { if (game.money >= 30) { game.money -= 30; game.lines[id].dur = 100; updateUI(); } }
    function toggleAuto(id) { const l = game.lines[id]; if(!l.hasAuto && game.money >= 500) { game.money -= 500; l.hasAuto = true; l.isAuto = true; } else if(l.hasAuto) { l.isAuto = !l.isAuto; } updateUI(); }
    function toggleAdmin() { const p = document.getElementById('admin-panel'); if (p.style.display !== 'flex') { if (prompt("Code?") === "0000") p.style.display = 'flex'; } else p.style.display = 'none'; }
    function inject(t, a) { if(t === 'money') game.money += a; else game.inv[t] += a; updateUI(); }
    function genOrders(id) { const ts=['wood','stone','iron','core']; game.lines[id].orders=[]; for(let i=0;i<3;i++) game.lines[id].orders.push({type:ts[Math.floor(Math.random()*4)], qty:Math.floor(Math.random()*5)+1}); }
    function renderOrders(id) { 
        const list = document.getElementById(`order-list-${id}`); list.innerHTML = '';
        game.lines[id].orders.forEach((o, idx) => {
            const d = document.createElement('div'); d.className = `order-card ${game.lines[id].selIdx === idx ? 'selected' : ''}`;
            d.innerHTML = `<b>${o.qty}x ${cfg[o.type].n}</b> <span style="float:right">$${Math.floor(o.qty*cfg[o.type].r*LINE_CONFIGS[id].m*(1+currentPrestige.bonus))}</span>`;
            d.onclick = () => { if(!game.lines[id].proc) { game.lines[id].selIdx = idx; updateUI(); } };
            list.appendChild(d);
        });
    }
    function resetGame() { if(confirm("重置?")) { localStorage.clear(); location.reload(); } }
    function secretTrigger() { game.adminClicks++; if(game.adminClicks > 10) toggleAdmin(); }

    initFloor();
    updateUI();
    setInterval(() => { for(let i=1; i<=5; i++) { if(game.unlocked[i] && game.lines[i].isAuto && !game.lines[i].proc) autoCycle(i); } }, 2000);

    async function autoCycle(id) {
        const l = game.lines[id]; if (!l.orders.length) return;
        l.selIdx = 0; const o = l.orders[0];
        if (game.inv[o.type] < o.qty) {
            const cost = (o.qty - game.inv[o.type]) * cfg[o.type].buy;
            if(game.money >= cost) { game.money -= cost; game.inv[o.type] = o.qty; updateUI(); } else return;
        }
        processOrder(id);
    }
</script>
