<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI 工廠模擬器 - v12.0.16</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>">
    <style>
        /* 引入外部字體：中文字體 Noto Sans TC 與 科技感數字字體 Share Tech Mono */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Share+Tech+Mono&display=swap');
        
        /* 基礎全域設定：背景深色、禁止文字選取、基礎間距 */
        body { background: #0d1117; color: #c9d1d9; font-family: 'Noto Sans TC', sans-serif; user-select: none; margin: 0; padding: 20px; }
        
        /* 頂部儀表板：固定在頂部，用於顯示金錢、資源等核心數據 */
		.dashboard { display: flex; justify-content: space-around; max-width: 1040px; position: sticky; top: 0; margin: 0 auto 10px auto; background: #21262d; padding: 15px; border-radius: 12px; border: 1px solid #30363d; z-index: 1000; align-items: center; }
		.stat-value { font-family: 'Share Tech Mono'; font-size: 20px; color: #58a6ff; } /* 數值文字樣式 */
		.stat-label { font-size: 11px; color: #8b949e; } /* 標籤文字樣式 */

        /* 🏆 稱號顯示容器：顯示玩家當前稱號等級與加成資訊 */
        .prestige-container { 
            display: flex; flex-direction: column; 
            background: linear-gradient(145deg, #161b22, #0d1117); 
            padding: 8px 15px; border-radius: 10px; border: 1px solid #484f58; 
            cursor: pointer; transition: 0.3s; min-width: 240px; 
        }
        .prestige-container:hover { border-color: #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.2); } /* 滑鼠懸停效果 */
        .prestige-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .prestige-badge { font-weight: 800; font-size: 20px; letter-spacing: 2px; padding: 8px 20px; border-radius: 4px; margin-top: 5px; margin-bottom: 0px;}
        
        /* 10級稱號顏色與特效：定義從普通到傳說級別的視覺差異 */
        .rank-1 { color: #8b949e; border: 1px solid #484f58; } /* 初學者 */
        .rank-2 { color: #3fb950; border: 1px solid #238636; text-shadow: 0 0 5px #238636; } 
        .rank-3 { color: #58a6ff; border: 1px solid #1f6feb; text-shadow: 0 0 5px #1f6feb; } 
        .rank-4 { color: #bc8cff; border: 1px solid #8957e5; text-shadow: 0 0 5px #8957e5; } 
        .rank-5 { color: #f2cc60; border: 1px solid #d29922; text-shadow: 0 0 8px #d29922; box-shadow: inset 0 0 5px #d29922; } 
        .rank-6 { color: #ff7b72; border: 1px solid #da3633; text-shadow: 0 0 10px #da3633; } 
        .rank-7 { color: #79c0ff; border: 1px solid #58a6ff; animation: glow-blue 2s infinite; } /* 藍光呼吸燈 */
        .rank-8 { color: #ffa657; border: 1px solid #f0883e; box-shadow: 0 0 15px rgba(240,136,62,0.4); text-shadow: 0 0 10px #f0883e; } 
        .rank-9 { color: #ff79c6; border: 1px solid #ff79c6; box-shadow: 0 0 20px rgba(255,121,198,0.4); text-shadow: 0 0 12px #ff79c6; } 
        /* 最高等級稱號：動態虹彩漸變特效 */
        .rank-10 { background: linear-gradient(45deg, #ffd700, #ff00ff); border: none; color: #fff; box-shadow: 0 0 25px #fff; text-shadow: 1px 1px 2px #000; animation: rainbow 3s infinite; } 

        /* 定義動畫：藍色發光與虹彩變換 */
        @keyframes glow-blue { 0%, 100% { box-shadow: 0 0 5px #58a6ff; } 50% { box-shadow: 0 0 20px #58a6ff; } }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        /* 彈窗 UI：用於顯示所有稱號列表與升級需求 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 5000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }

/* 建議將原本的 .modal-content 微調如下 */
	.modal-content { 
    background: #161b22; 
    width: 90%;          /* 加入這個：確保在小螢幕不會爆出去 */
    max-width: 550px;    /* 將原本的 width 改為 max-width */
    padding: 25px; 
    border-radius: 16px; 
    border: 1px solid #30363d; 
    max-height: 90vh; 
    overflow-y: auto; 
    box-shadow: 0 10px 50px rgba(0,0,0,0.5); /* 加入這個：增加立體感 */
}        
		.prestige-list { margin-top: 15px; border: 1px solid #30363d; border-radius: 8px; }
        
		/* 列表項：使用 Grid 佈局顯示名稱、加成、費用等 */
        .prestige-item { display: grid; grid-template-columns: 1.2fr 0.8fr 0.6fr 0.6fr 0.6fr; padding: 10px; border-bottom: 1px solid #21262d; font-size: 11px; align-items: center; text-align: center; }
        .prestige-item.current-rank { background: rgba(88, 166, 255, 0.15) !important; border: 1px solid #58a6ff !important; box-shadow: inset 0 0 10px rgba(88, 166, 255, 0.3); }

/* 統一容器寬度與置中 */
.dashboard, .factory-floor {
    width: 550px;
    max-width: 1040px; /* 設定一個統一的像素上限 */
    margin-left: auto;
    margin-right: auto;
    box-sizing: border-box; /* 確保 padding 不會撐大寬度 */
}

        /* 工廠區域：遊戲核心操作畫面 */
        .factory-floor { position: relative; max-width: 1040px; height: 50vh; margin: 20px auto; background: #161b22; border: 2px solid #30363d; border-radius: 16px; overflow-y: auto; padding: 0 10px; }
       .line-group { position: relative; height: 210px; border-bottom: 1px solid #21262d; } /* 單條生產線容器 */
        .line-label { position: absolute; left: 12px; top: 12px; font-size: 11px; color: #8b949e; font-weight: bold; opacity: 0.6; }
        /* 鎖定遮罩：未開啟產線時的顯示狀態 */
        .locked-line { position: absolute; inset: 0; background: rgba(13, 23, 13, 0.98); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        
        /* 工作站單元：包含訂單列表、操作按鈕與進度條 */
        .station { position: absolute; top: 40px; height: 158px; background: rgba(48, 54, 61, 0.2); border: 1px solid #30363d; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; box-sizing: border-box; }
        .order-container { width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 3px; overflow: hidden; margin-bottom: 4px; }
        .order-card { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .order-card:hover { border-color: #58a6ff; }
        .order-card.selected { border-color: #3fb950; background: #132316; } /* 被選中的訂單樣式 */
        
        /* 操作按鈕：具有 3D 壓下效果的按鈕 */
        .action-btn { width: 100%; padding: 6px 0; border: none; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 12px; color: white; display: block; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,0.2); flex-shrink: 0; transition: 0.1s; }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
        .action-btn:disabled { filter: grayscale(1); opacity: 0.3; cursor: not-allowed; }
        
        /* 按鈕顏色分類：綠色生產、藍色升級、紅色維修 */
        .btn-green { background: #238636; border-bottom: 2px solid #1a6328; }
        .btn-blue { background: #1f6feb; border-bottom: 2px solid #1858ba; }
        .btn-red { background: #da3633; border-bottom: 2px solid #a42825; }
        
        .price-tag { color: #f2cc60; font-size: 11px; } /* 顯示價格的金色文字 */
        .durability-box { width: 100%; height: 5px; background: #0d1117; border-radius: 3px; margin-bottom: 4px; overflow: hidden; } /* 耐久度外殼 */
        .dur-fill { height: 100%; background: #3fb950; transition: 0.3s; } /* 耐久度進度條顏色 */
        
        .progress-container { width: 100%; height: 6px; background: #0d1117; border-radius: 3px; overflow: hidden; visibility: hidden; border: 1px solid #30363d; margin-bottom: 4px; }
        .progress-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #bc8cff, #8957e5); } /* 生產進度條顏色 */
        
        /* 零件物體：在產線上移動的小方塊視覺效果 */
        .part { position: absolute; width: 32px; height: 32px; border-radius: 8px; z-index: 50; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        .part-rp { background: #8b5a2b; } /* 木材零件顏色 */
        .part-wood { background: #8b5a2b; } /* 木材零件顏色 */
        .part-stone { background: #7d7d7d; } /* 石材零件顏色 */
        .part-iron { background: #4a90e2; } /* 鐵材零件顏色 */
        .part-core { background: #f2cc60; color: #000; box-shadow: 0 0 15px rgba(242,204,96,0.5); } /* 核心零件顏色 */
		.part-diamond { background: #b9f2ff; color: #333; box-shadow: 0 0 15px rgba(185,242,255,0.6); } /* 鑽石零件顏色 */
		.part-water { background: #0077be; box-shadow: 0 0 10px #0077be; }																	
		.part-gold { background: #4a90e2; } /* 鐵材零件顏色 */

        /* 底部 UI 佈局：分成日誌欄、升級欄、控制欄 */
        .bottom-ui { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 15px; max-width: 1040px; margin: 20px auto; }
        .panel-box { background: #161b22; padding: 15px; border-radius: 12px; border: 1px solid #30363d; }
        
        /* 遊戲日誌：顯示系統訊息的終端機樣式 */
        .log-container { background: #0d1117; height: 130px; overflow-y: auto; border: 1px solid #30363d; padding: 10px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #3fb950; border-radius: 8px; line-height: 1.5; }
        
        /* 管理員控制項樣式 */
        .admin-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #21262d; padding: 8px; border-radius: 6px; }
        .admin-input { width: 60px; background: #0d1117; border: 1px solid #30363d; color: #58a6ff; padding: 4px; text-align: center; border-radius: 4px; font-size: 11px; }
	/* ==========================================
   🏆 稱號與資源佈局修正 (CSS)
   📦 功能：確保頂部橫條不崩潰，文字居中清晰
   ========================================== */

/* 1. 資源容器：確保格子橫向排列，空間不夠時自動換行 */
/* 資源容器：解決嚴重錯位 */
#main-dashboard-resources {
    display: grid;
    /* 強制分成 5 欄，每欄等寬，解決重疊問題 */
    grid-template-columns: repeat(5, 1fr); 
    gap: 1px;
    flex-grow: 1;
    align-items: center;
    border-left: 1px solid #30363d;
    padding-left: 20px;
}
/* 單個資源項目的排版 */
.resource-item {
    display: flex;
    flex-direction: column; /* 文字在上，數字在下 */
    align-items: flex-start;
    min-width: 60px;
}

/* 2. 稱號加成摘要：修正錯位，讓綠、紫、藍數值水平居中 */
#prestige-bonus-summary {
    display: flex;
    justify-content: center;   /* 水平居中 */
    align-items: center;
    gap: 12px;                 /* 數值之間的空格 */
    width: 100%;               
    margin-top: 6px;           
    font-family: 'Share Tech Mono', monospace;
}

/* 數值樣式強化 */
.stat-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px; /* 稍微縮小字體防止溢出 */
    color: #ffffff !important;
    white-space: nowrap; /* 禁止數字換行 */
}									 
    </style>
</head>
<body>

<!-- 🏆 聲望系統彈窗：當點擊背景遮罩時觸發關閉函數 -->
<div id="prestige-modal" class="modal-overlay" onclick="if(event.target==this) togglePrestigeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 style="color:#58a6ff; text-align:center; margin-top:0;">🏆 產業聲望階級表</h2>
        
        <!-- 晉升進度顯示區：包含文字說明與視覺進度條 -->
        <div style="background:#0d1117; padding:15px; border-radius:10px; border:1px solid #30363d; margin-bottom:15px;">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;">
                <span>晉升進度</span>
                <span id="next-rank-info" style="color:#f2cc60">還需 $0</span>
            </div>
            <div style="height:8px; background:#21262d; border-radius:4px; overflow:hidden;">
                <!-- 根據資金達成率動態調整寬度的填充條 -->
                <div id="prestige-progress-fill" style="height:100%; background:#58a6ff; width:0%; transition:0.5s;"></div>
            </div>
        </div>

        <!-- 稱號列表標題：定義各列數據的含義 -->
        <div class="prestige-item" style="background:#21262d; font-weight:bold; color:#8b949e; border-radius:8px 8px 0 0;">
            <span>階級</span><span>解鎖資金</span><span>利潤</span><span>速度</span><span>檢測</span>
        </div>
        <!-- 稱號內容容器：由 JavaScript 動態生成的等級清單會放在這裡 -->
        <div id="prestige-list-container" class="prestige-list"></div>
        <button class="action-btn btn-blue" style="margin-top:20px; height:40px;" onclick="togglePrestigeModal()">返回工廠</button>
    </div>
</div>

<!-- ⚙️ 系統管理面板：供開發測試使用的後台介面 -->
<div id="admin-panel" class="modal-overlay">
    <div class="admin-content" style="background: #161b22; width: 500px; padding: 25px; border-radius: 16px; border: 1px solid #58a6ff; max-height: 85vh; overflow-y: auto;">
        <h3 style="color:#58a6ff; text-align:center; margin-top:0;">⚙️ 系統管理面板</h3>        
        
        <!-- 稱號數值調整區：可手動修改各級稱號的百分比加成 -->
        <div style="color:#bc8cff; font-weight:bold; margin-bottom:10px;">💎 稱號加成參數 (修改後自動保存)</div>
        <div class="admin-row" style="background:none; border-bottom:1px solid #30363d; font-size:10px; color:#8b949e;">
            <span>稱號名稱</span><span>利潤%</span><span>速度%</span><span>QA%</span>
        </div>
        <div id="admin-prestige-settings"></div>

        <hr style="border:0; border-top:1px solid #30363d; margin:20px 0;">
        
        <!-- 資源價格與數量注入區：包含所有原材料的控制項 -->
        <div style="color:#f2cc60; font-weight:bold; margin-bottom:10px;">📦 資源基礎價格</div>
		<div id="admin-resource-settings">
        </div>

        <!-- 系統綜合功能按鈕：資金注入、存檔、重置及關閉面板 -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <button class="action-btn btn-blue" onclick="inject('money', 999999999)">💰 資金 +9億9</button>
            <button class="action-btn btn-green" onclick="saveGame()">手動存檔</button>
            <button class="action-btn btn-red" onclick="resetGame()">⚠️ 重置數據</button>
            <button class="action-btn btn-blue" style="background:#30363d" onclick="toggleAdmin()">返回工廠</button>
        </div>
    </div>
</div>

<!-- 頂部數據儀表板容器：固定在頁面頂部，展示核心資源與稱號資訊 -->
<div class="dashboard" id="main-dashboard"> <!-- 稱號最重要加返id="main-dashboard"-->
    <!-- 🏆 稱號顯示區：點擊後會觸發 secretTrigger() 函數（可能是開啟詳細面板或特殊觸發） -->
<div class="stat-box prestige-click-area" 
     onclick="togglePrestigeModal()" 
     style="min-width: 165px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: 1px solid #f2cc60; background: rgba(242, 204, 96, 0.1); padding: 8px 12px; border-radius: 12px; box-sizing: border-box; transition: transform 0.2s, background 0.2s;">
    
    <div class="stat-label" style="margin-bottom: 12px; color: #f2cc60; font-weight: bold; font-size: 10px; letter-spacing: 1px;">🏆 當前稱號</div>
    <div style="height: 15px; width: 100%;"></div>
	<!-- 稱號 -->
    <div id="prestige-badge" class="prestige-badge rank-1" style="white-space: nowrap; font-size: 40px; font-weight: 800; text-shadow: 0 0 20px rgba(242,204,96,0.5);">載入中...</div>
    <!-- 進度條與百分比容器 -->
	<div style="width: 100%; display: flex; align-items: center; gap: 1px; margin-top: 10px; margin-bottom: 5px;">
	<!-- 進度條背景 (黑色的底槽) --> 
	<div style="flex-grow: 2; height: 6px; background: #161b22; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
	<!-- 進度條填充 (會動的金色部分) -->
        <div id="dashboard-prestige-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #f2cc60, #ffd700); box-shadow: 0 0 8px rgba(242,204,96,0.6); transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);"></div>
	</div>
	<!-- 百分比數值 (prestige-percent-text) -->
    <span id="prestige-percent-text" style="font-size: 11px; color: #f2cc60; font-weight: bold; min-width: 35px; text-align: right; font-family: 'Share Tech Mono', monospace;">0%</span>
	</div>
    <!-- 進度條下 顯示 利潤:+0% 速度:+0% -->
    <!-- <div id="prestige-bonus-summary" style="font-size: 10px; color: #8b949e; font-family: 'Share Tech Mono';">利潤:+0% 速度:+0%</div> -->
	</div>
    <!-- 💰 資金顯示方塊：展示玩家目前擁有的總現金額 -->
    <div class="stat-box">
        <div class="stat-label">💰 當前資金</div>
        <div id="money-val" class="stat-value">$0</div>
    </div>

    <!-- 🧪 研究點數顯示方塊：展示玩家目前擁有的研究點數 -->	
	<div class="stat-item">
		<div class="stat-label">🧪 研究點數</div>
		<div id="rp-val" class="stat-value" style="color: #a371f7;">0</div>
	</div>

	<div id="resource-stats" style="display: contents;">
        </div>

    <!-- ⚙️ 全局設定按鈕：點擊後觸發 toggleAdmin() 開啟管理員後台面板 -->
    <button class="action-btn btn-green" style="width:100px; height:42px;" onclick="toggleAdmin()">⚙️ 全局設定</button>
</div>

<!-- 🏭 工廠生產地板：這是遊戲的核心區域，所有產線都會動態生成在 lines-container 內 -->
<div class="factory-floor" id="floor">
    <div id="lines-container"></div>
</div>

    <!-- 👨‍🔧 研發實驗室面板面板 -->
<div class="shop-container" style="margin-top:20px; border-color: #a371f7; max-width: 1040px; margin-left: auto; margin-right: auto;">
    <h2 style="color: #a371f7; margin-top:0;">👨‍🔧 研發實驗室 (Tech Tree)</h2>
    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div class="shop-item" style="flex:1; min-width:200px;">
            <div style="font-weight:bold; color:#a371f7;">🛠️ 全自動維修</div>
            <div style="font-size:12px; color:#8b949e; margin:5px 0;">設備健康度 < 20% 時自動消耗 $30 修復</div>
            <button id="tech-repair-btn" class="action-btn" style="width:100%;" onclick="buyTech('autoRepair', 50)">解鎖 (50 RP)</button>
        </div>
        <div class="shop-item" style="flex:1; min-width:200px;">
            <div style="font-weight:bold; color:#a371f7;">⚡ 加班模式</div>
            <div style="font-size:12px; color:#8b949e; margin:5px 0;">生產速度 +50%，但健康度損耗速度加倍</div>
            <button id="tech-overtime-btn" class="action-btn" style="width:100%;" onclick="buyTech('overtime', 150)">解鎖 (150 RP)</button>
        </div>
        <div class="shop-item" style="flex:1; min-width:200px;">

<script>
    // 🏆 稱號與多重加成定義：控制遊戲不同階段的利潤、速度及檢測加成
// ==========================================
// [Script] PRESTIGE_LEVELS 聲望/稱號系統等級配置表
// 📦 明細或用途：
// 此數組定義了玩家在遊戲中的成長階段。
// 1. lv: 等級編號。
// 2. name: 稱號名稱（包含圖標）。
// 3. min: 升級所需的最低資產（觸發條件）。
// 4. bonus: 利潤加成（例如 0.05 代表訂單收入增加 5%）。
// 5. speed: 生產速度加成（例如 0.10 代表進度條跑得快 10%）。
// 6. qa: 質量檢測（QA）合格率補償（減少次品率）。
// 7. class: 對應 CSS 的樣式類名，用於改變 UI 顏色。
// ==========================================
let PRESTIGE_LEVELS = [
{ lv: 1,  name: "🌱 初出茅廬", min: 0,          bonus: 0,    speed: 0,    qa: 0,    class: "rank-1" },
{ lv: 2,  name: "⚒️ 潛力新人", min: 5000,       bonus: 0.05, speed: 0.05, qa: 0.02, class: "rank-2" },
{ lv: 3,  name: "🔧 熟練工匠", min: 20000,      bonus: 0.10, speed: 0.10, qa: 0.04, class: "rank-3" },
{ lv: 4,  name: "🚛 地區供應", min: 100000,     bonus: 0.15, speed: 0.15, qa: 0.06, class: "rank-4" },
{ lv: 5,  name: "🏭 產業支柱", min: 500000,     bonus: 0.25, speed: 0.20, qa: 0.08, class: "rank-5" },
{ lv: 6,  name: "💰 貿易大亨", min: 2000000,    bonus: 0.40, speed: 0.25, qa: 0.10, class: "rank-6" },
{ lv: 7,  name: "🌐 跨國集團", min: 10000000,   bonus: 0.60, speed: 0.30, qa: 0.12, class: "rank-7" },
{ lv: 8,  name: "👑 全球霸主", min: 50000000,   bonus: 0.85, speed: 0.35, qa: 0.15, class: "rank-8" },
{ lv: 9,  name: "🚀 科技先驅", min: 200000000,  bonus: 1.20, speed: 0.45, qa: 0.18, class: "rank-9" },
{ lv: 10, name: "🌌 星際造物", min: 1000000000, bonus: 2.00, speed: 0.60, qa: 0.25, class: "rank-10" }
];
// ==========================================
// [Script] PRESTIGE_LEVELS 聲望/稱號系統等級配置表 - 完結
// ==========================================

// ==========================================
// [Script] LINE_CONFIGS 生產線動態配置生成
// 📦 明細或用途：
// 此區塊透過迴圈自動計算每一條生產線的解鎖成本、效率倍率與名稱，確保遊戲具備擴展性。
// 1. LINE_COUNT: 參考先前設定的總數（如 10），決定生成的數量。
// 2. u (Unlock Cost): 解鎖成本。
//    - 第 1 條線預設為 0（自動開啟）。
//    - 第 2 條線起採用指數增長公式：500 * (2.5 ^ (i-2))，讓後期產線解鎖難度遞增。
// 3. m (Multiplier): 效率倍率。
//    - 每一級增加 0.5 倍（1.0, 1.5, 2.0...），代表越後期的產線生產力越強。
// 4. n (Name): 名稱。
//    - 使用 padStart 確保編號顯示為兩位數（如 01, 02... 10）。
// ==========================================

const LINE_COUNT = 10; // 修改這裡：設定你想要的產線數量

// 🏗️ 產線配置：將 LINE_CONFIGS 改為動態生成或擴展
const LINE_CONFIGS = {};
for(let i=1; i<=LINE_COUNT; i++) {
    LINE_CONFIGS[i] = {
        u: (i === 1) ? 0 : Math.floor(500 * Math.pow(2.5, i - 2)), // 自動計算解鎖成本
        m: 1.0 + (i - 1) * 0.5, // 自動計算效率倍率 (1.0, 1.5, 2.0...)
        n: i.toString().padStart(2, '0')
    };
}
// ==========================================
// [Script] LINE_CONFIGS 生產線動態配置生成 - 完結
// ==========================================

// ==========================================
// [Script] cfg 資源屬性配置表
// 📦 明細或用途：
// 此對象定義了遊戲中所有可生產材料的核心參數，系統會根據此表自動生成訂單與採購清單：
// 1. n (Name): 材料的繁體中文名稱。
// 2. c (Class): 對應 CSS 的類名，決定零件在傳送帶上的顏色與外觀。
// 3. r (Revenue): 基礎售價（利潤計算基準）。
// 4. buy (Purchase Price): 採購原料的原始成本。
// 5. range: [最小產線, 最大產線]。
//    - 定義該材料「准許出現」的生產線編號。
//    - 例如 diamond [8, 10] 表示鑽石訂單只會出現在第 8、9、10 號產線。
// 💡 提示：若要新增材料（如：銀），只需在此處添加一行並設定對應的 range 即可全域生效。
// ==========================================
let cfg = { 
    // n:名稱, i:圖標, c:CSS類, r:售價, buy:買價, range:產線範圍
    wood:    { n: '木材', i: '🪵', c: 'part-wood',    r: 15,  buy: 5,   range: [1, 100] },
    stone:   { n: '石頭', i: '🪨', c: 'part-stone',   r: 30,  buy: 10,  range: [1, 100] }, 
    iron:    { n: '鋼鐵', i: '⛓️', c: 'part-iron',    r: 55,  buy: 15,  range: [1, 100] },
    core:    { n: '核心', i: '🔋', c: 'part-core',    r: 150, buy: 50,  range: [3, 100] },
    diamond: { n: '鑽石', i: '💎', c: 'part-diamond', r: 500, buy: 200, range: [8, 10] },
	water:   { n: '水',   i: '💧', c: 'part-water',   r: 800, buy: 250, range: [8, 10] },
    gold:    { n: '黃金', i: '🟡', c: 'part-gold',    r: 1000, buy: 300, range: [8, 10] }
};
// ==========================================
// [Script] cfg 資源屬性配置表 - 完結
// ==========================================

// ==========================================
// [Script] game 遊戲主狀態對象 (核心存檔數據)
// 📦 明細或用途：
// 此對象封裝了玩家所有的即時進度，存檔系統（localStorage）主要就是儲存這個對象：
// ==========================================
    let game = {
        money: 100,				// 1. money: 當前持有的可用資金。
		maxMoney: 0,			// 2. maxMoney: 歷史最高資金（用於判斷聲望/稱號等級的晉升）。
		inv: {},				// 3. inv: 庫存系統，紀錄玩家持有的材料數量（例如 {wood: 50, iron: 10}）。
        unlocked: {},			// 4. unlocked: 紀錄哪些生產線已被玩家支付費用解鎖。
		lines: {},				// 5. lines: 每條生產線的詳細運行狀態（如進度、當前項目、耐久度、自動化開關）。
		prices: null,			// 6. prices: 遊戲內的價格表副本，用於在後台修改價格後同步。
        customPrestige: null,	// 7. customPrestige: 管理員模式下自定義的稱號數據。
        adminClicks: 0,			// 8. adminClicks: 紀錄點擊次數，用於觸發管理員模式的隱藏機制。
		researchPoints: 0,		// 9. researchPoints: 🧪 研發點數，用於解鎖進階科技。
		tech: {					// 10. tech: 科技樹狀態，包含：
			autoRepair: false,	//     - autoRepair: 是否開啟自動維修。
			overtime: false,	//     - overtime: 是否開啟加班模式（提升速度）。
			highOrder: false	//     - highOrder: 是否解鎖高額報酬訂單。
		}
    };
// ==========================================
// [Script] game 遊戲主狀態對象 - 完結
// ==========================================

	// 新增這段：自動根據 cfg 建立所有材料庫存
	Object.keys(cfg).forEach(type => { game.inv[type] = 0; });
	
// ==========================================
// [Script] 遊戲數據初始化 - 生產線狀態循環生成
// 📦 明細或用途：
// 此區塊透過迴圈確保 game 對象中每一條生產線都具備完整的初始數據結構。
// ==========================================
// *** 關鍵修正：循環初始化所有產線數據 ***
for(let i=1; i<=LINE_COUNT; i++) {
game.lines[i] = {	// 1. game.lines[i]: 初始化第 i 條生產線的運行參數：
lv: 0,				//    - lv: 生產線等級（影響生產速度）。
dur: 100,			//    - dur: 耐久度（100 為全滿，隨生產消耗）。
isAuto: false,		//    - isAuto: 當前是否正處於自動化運行狀態。
hasAuto: false,		//    - hasAuto: 玩家是否已購買該線的自動化模組。
proc: false,		//    - proc: 當前正在生產的材料 ID (例如 'wood')。
selIdx: -1,			//    - selIdx: 當前選中的訂單索引編號。
orders: []			//    - orders: 該生產線專屬的訂單清單（存儲 3 份隨機訂單）。
};
game.unlocked[i] = (i === 1); // 權限初始化。只有第一條預設解鎖
}
// ==========================================
// [Script] 遊戲數據初始化 - 生產線狀態循環生成 - 完結
// ==========================================

    let currentPrestige = PRESTIGE_LEVELS[0];


// ==========================================
// [Script] addLog 系統日誌輸出功能
// 📦 明細或用途：
// 此函數負責在遊戲介面的日誌欄位（Terminal）顯示即時訊息：
// 1. 參數 m (Message): 要顯示的文字內容。
// 2. 參數 c (Color): 文字顏色，預設為螢光綠 (#3fb950)，可用於區分一般訊息、警告（紅色）或成功（金色）。
// 3. 邏輯流程：
//    - 獲取 HTML 中的日誌容器 'log'。
//    - 創建一個新的 div 元素，並加上當前時間戳記（例如）。
//    - 使用 prepend() 將新訊息插入到最上方，讓玩家第一時間看到最新資訊。
//    - 自動清理：若訊息超過 50 條，則刪除最舊的一條，防止網頁因內容過多而卡頓。
// ==========================================
    function addLog(m, c='#3fb950') { 
        const log = document.getElementById('log'); if(!log) return;
        const d = document.createElement('div'); d.style.color = c; d.innerHTML = `[${new Date().toLocaleTimeString()}] > ${m}`; 
        log.prepend(d); if(log.childNodes.length > 50) log.lastChild.remove();
    }

// ==========================================
// [Script] addLog 系統日誌輸出功能 - 完結
// ==========================================

// ==========================================
// [Script] updatePrestige 稱號晉升與成就邏輯
// 📦 明細或用途：
// 此函數負責監控玩家的財富成長，並自動判定、解鎖與更新玩家的稱號等級。
// 1. 最高紀錄維護：
//    - 自動比較當前資金與 game.maxMoney，確保最高紀錄隨時更新。
// 2. 晉升判定（基於歷史最高紀錄）：
//    - 從最高級別開始向下比對，只要 maxMoney 達到等級門檻（min），即判定為該等級。
//    - 💡 優點：即使玩家採購材料花光錢，稱號也不會降級，保持加成效果。
// 3. 晉升提醒：
//    - 當等級發生變動時，呼叫 addLog 發送金色喜報訊息。
// 4. UI 實時渲染：
//    - 更新標籤名稱與對應的 CSS 特效（如 rank-10 的虹彩效果）。
//    - 計算並更新「加成摘要」（利潤、速度、質量）。
//    - 更新通往下一等級的進度條百分比。
// ==========================================
    function updatePrestige() {
	
		// 🛡️ 安全檢查：確保 maxMoney 隨時跟上目前資金
        if (game.money > (game.maxMoney || 0)) {
            game.maxMoney = game.money;
        }
	
        let matched = PRESTIGE_LEVELS[0];
        let nextRank = PRESTIGE_LEVELS[1];
		
		// ⭐ 關鍵：使用 game.maxMoney 來判定，這樣花錢就不會掉階
        for (let i = PRESTIGE_LEVELS.length - 1; i >= 0; i--) {
            if (game.maxMoney >= PRESTIGE_LEVELS[i].min) {
                matched = PRESTIGE_LEVELS[i];
                nextRank = PRESTIGE_LEVELS[i+1] || null;
                break;
            }
        }
		

    // 3. 🏆 晉升日誌觸發
    if (currentPrestige.lv !== matched.lv) {
        addLog(`🏆 晉升！【${matched.name}】啟用全方位加成`, "#f2cc60");
        currentPrestige = matched;
    }

    // --- [UI 更新區塊] ---
    const badge = document.getElementById('prestige-badge');
    const bonusSummary = document.getElementById('prestige-bonus-summary');
    const progressBar = document.getElementById('dashboard-prestige-bar');
    
    // ✨ 注意：這裡要對應你 HTML 裡的百分比 ID
    const percentText = document.getElementById('prestige-percent-text') || document.getElementById('prestige-percent');

    // 更新稱號文字與外觀類別
    if (badge) {
        badge.innerText = matched.name;
        badge.className = `prestige-badge ${matched.class}`;
    }

    // 更新加成摘要
	//if (bonusSummary) {
	//     bonusSummary.innerText = `利潤:+${(matched.bonus * 100).toFixed(0)}% 速度:+${(matched.speed * 100).toFixed(0)}% 質量:+${(matched.qa * 100).toFixed(0)}%`;
	// }

    // 4. 📈 進度條與百分比數字邏輯
    if (progressBar) {
        if (nextRank) {
            // 計算進度：(目前錢 - 這級起點) / (下一級起點 - 這級起點)
            let progress = ((game.maxMoney - matched.min) / (nextRank.min - matched.min)) * 100;
            let displayVal = Math.floor(Math.min(99, progress)); // 未滿級顯示 0~99%
            
            progressBar.style.width = displayVal + "%";
            progressBar.style.background = "linear-gradient(90deg, #f2cc60, #ffd700)"; // 正常金色
            
            if (percentText) {
                percentText.innerText = displayVal + "%";
                percentText.style.color = "#f2cc60";
            }
        } else {
            // 🏅 滿級狀態
            progressBar.style.width = "100%";
            progressBar.style.background = "linear-gradient(90deg, #00f2ff, #00d4ff)"; // 滿級變青藍色
            
            if (percentText) {
                percentText.innerText = "滿級"; // 解決顯示 0% 的關鍵
                percentText.style.color = "#00f2ff";
                percentText.style.fontWeight = "900";
            }
        }
    }
}
	
// ==========================================
// [Script] updatePrestige 稱號晉升與成就邏輯 - 完結
// ==========================================	

    // 🖥️ UI 顯示與管理員功能 (togglePrestigeModal, renderPrestigeList, updateAdminPrestigeUI, modifyPrestige, updatePrice 等)
// ==========================================
// [Script] togglePrestigeModal 稱號系統彈窗切換控制
// 📦 明細或用途：
// 此函數負責處理稱號列表彈窗（Modal）的顯示與隱藏邏輯：
// 1. 獲取 HTML 元素：透過 prestige-modal ID 找到彈窗容器。
// 2. 顯示/隱藏切換：
//    - 若彈窗目前為顯示狀態 (flex)，則將其設定為隱藏 (none)。
//    - 若彈窗目前為隱藏狀態，則先執行 renderPrestigeList() 更新列表內容，再將其顯示出來。
// 💡 提示：在顯示前先執行渲染函數，能確保玩家看到的「當前等級高亮」與「晉升進度」是最新的數據。
// ==========================================
    function togglePrestigeModal() {
        const modal = document.getElementById('prestige-modal');
        if (modal.style.display === 'flex') { modal.style.display = 'none'; } 
        else { renderPrestigeList(); modal.style.display = 'flex'; }
    }
// ==========================================
// [Script] togglePrestigeModal 稱號系統彈窗切換控制 - 完結
// ==========================================

// ==========================================
// [Script] renderPrestigeList 稱號系統列表渲染與進度顯示
// 📦 明細或用途：
// 此函數負責動態生成稱號系統彈窗內的內容，讓玩家查看所有等級的加成與晉升條件。
// 1. 進度追蹤：
//    - 使用 game.maxMoney 計算距離下一個等級還差多少資金。
//    - 更新彈窗內的文字提示（如：「還需 $10,000 晉升」）。
//    - 更新彈窗專屬的進度條長度。
// 2. 列表生成：
//    - 遍歷 PRESTIGE_LEVELS 數組，為每個等級創建一個 div 區塊。
//    - 自動判定 current-rank：為玩家目前的等級加上高亮框與背景特效。
// 3. 數據展示：
//    - 顯示等級名稱、達成所需的金額條件。
//    - 以不同顏色標示各項加成數值（綠色：利潤、紫色：速度、藍色：質量）。
// 💡 提示：使用 .toLocaleString() 確保金額數字會自動加上千分位逗號（如 $1,000,000）。
// ==========================================
    function renderPrestigeList() {
        const container = document.getElementById('prestige-list-container');
        const nextInfo = document.getElementById('next-rank-info');
        const barFill = document.getElementById('prestige-progress-fill');
        container.innerHTML = '';
		
		// 使用 maxMoney 尋找下一階
        let nextRank = PRESTIGE_LEVELS.find(l => l.min > game.maxMoney);
        if (nextRank) {
			// 顯示剩餘所需資金
            nextInfo.innerText = `還需 $${Math.floor(nextRank.min - game.maxMoney).toLocaleString()} 晉升`;
			// 計算彈窗進度條百分比
			barFill.style.width = Math.min(100, ((game.maxMoney - currentPrestige.min) / (nextRank.min - currentPrestige.min)) * 100) + "%";
        } else { 
			// 封頂狀態
			nextInfo.innerText = "已達成最高階級";
			barFill.style.width = "100%"; 
		}
		// 📜 循環生成每一行稱號資訊
        PRESTIGE_LEVELS.forEach(l => {
            const isCurrent = (currentPrestige.lv === l.lv);
            const div = document.createElement('div');
			// 如果是當前等級，賦予特殊的 CSS 類名
            div.className = `prestige-item ${isCurrent ? 'current-rank' : ''}`;
			// 注入 HTML：包含稱號標籤、門檻金額、三項加成數據
            div.innerHTML = `
                <span class="prestige-badge ${l.class}">${l.name}</span>

// [Script] updatePrice 管理員材料價格動態調整
// 📦 明細或用途：
// 此函數負責將管理員在後台輸入框填寫的新價格同步到遊戲配置中。
// 1. 數據獲取：
//    - 使用 getElementById 抓取對應材料（如 wood, iron）的買入與賣出輸入框。
//    - 使用 parseInt 轉換為整數，確保運算安全，若輸入無效則設為 0。
// 2. 配置同步：
//    - 直接修改全局配置 cfg：buy 影響採購成本，r 影響訂單售價。
//    - game.prices: 進行深拷貝 (Deep Copy) 存入存檔對象，確保重啟遊戲後價格能被保留。
// 3. UI 響應：
//    - 執行 updateUI() 讓所有顯示價格的地方（商店、生產線）立即刷新。
// 4. 操作日誌：
//    - 呼叫 addLog 以黃色字體 (#f1c40f) 顯示修改紀錄，確保管理員知道修改已生效。
// ==========================================
/**
 * 優化原有的 updatePrice 函數
 * 確保修改後能同步數據、更新 UI 並留下紀錄
 */
function updatePrice(type) {
    // 1. 從輸入框獲取最新數值，若為空則預設 0
    const newBuy = parseInt(document.getElementById(`edit-buy-${type}`).value) || 0;
    const newSell = parseInt(document.getElementById(`edit-sell-${type}`).value) || 0;

    // 2. 更新配置對象 cfg
    cfg[type].buy = newBuy;
    cfg[type].r = newSell;

    // 3. 同步到遊戲存檔數據中 (保留你原有的邏輯)
    game.prices = JSON.parse(JSON.stringify(cfg));

    // 4. 刷新介面顯示
    updateUI();

    // 5. [新增] 在遊戲日誌顯示修改成功，方便除錯
    if(typeof addLog === 'function') {
        addLog(`🛠️ 管理員：${cfg[type].n} 價格已調整 (買:${newBuy} / 賣:${newSell})`, "#f1c40f");
    }
}

// ==========================================
// [Script] updateUI 全域數據同步刷新 (整合優化版)
// ==========================================
function updateUI() {
    // ⭐ [整合] 同步稱號數據與儀表板進度條
    if (typeof updatePrestige === 'function') updatePrestige(); 
    
    // 1. 更新金錢
    const moneyValEl = document.getElementById('money-val');
    if(moneyValEl) moneyValEl.innerText = `$${Math.floor(game.money).toLocaleString()}`;
    
    // ✨ 更新研究點數 (RP)
    const rpValEl = document.getElementById('rp-val');
    if(rpValEl) rpValEl.innerText = (game.researchPoints || 0).toLocaleString();
    
    // 2. 更新資源庫存與商店價格
    Object.keys(cfg).forEach(t => {
        const valEl = document.getElementById(`${t}-val`);
        if(valEl) valEl.innerText = game.inv[t];
    
        const btnP = document.getElementById(`btn-p-${t}`);
        if(btnP) btnP.innerText = cfg[t].buy;
    });

    // 3. 循環更新每一條生產線
    for(let i=1; i<=LINE_COUNT; i++) {
        const l = game.lines[i]; 
        const un = game.unlocked[i];
        const lockEl = document.getElementById(`lock-${i}`);
        
        if(lockEl) {
            // 處理鎖定遮罩顯示/隱藏
            lockEl.style.display = un ? 'none' : 'flex';
        
            // 如果未解鎖：處理「階梯式解鎖」邏輯 (需前一條線開啟)
            if(!un) {
                const buyBtn = document.getElementById(`buy-line-btn-${i}`);
                if(buyBtn) {
                    const cost = LINE_CONFIGS[i].u;
                    const prevUnlocked = (i === 1) || game.unlocked[i-1];
                    
                    if(!prevUnlocked) {
                        buyBtn.innerText = `🔒 需先解鎖 Line ${(i-1).toString().padStart(2, '0')}`;
                        buyBtn.disabled = true;
                        buyBtn.style.background = "#30363d";
                    } else {
                        const enoughMoney = game.money >= cost;
                        buyBtn.innerText = `支付 $${cost.toLocaleString()} 解鎖`;
                        buyBtn.disabled = !enoughMoney;
                        buyBtn.style.background = enoughMoney ? "#238636" : "#30363d";
                        buyBtn.style.opacity = enoughMoney ? "1" : "0.6";
                    }
                }
            }
        }

        // --- 如果已經解鎖，更新內部精密資訊 ---
        if(un && l) {
            // 更新等級標籤
            const lvTag = document.getElementById(`lv-tag-${i}`);
            if(lvTag) lvTag.innerText = `Lv.${l.lv}`;

            // 更新生產速度 (計算科技加成與稱號加成)
            const speedVal = document.getElementById(`speed-val-${i}`);
            if(speedVal) {
                let baseSpeed = (15 - (l.lv * 1.3));
                let otBonus = (game.tech && game.tech.overtime) ? 0.5 : 0; 
                let finalSpeed = baseSpeed * (1 - (currentPrestige.speed || 0) - otBonus);
                speedVal.innerText = Math.max(0.5, finalSpeed).toFixed(1);
            }
            
            // 更新升級按鈕狀態
            const upBtn = document.getElementById(`up-btn-${i}`);
            const upCost = document.getElementById(`up-cost-${i}`);
            const cost = Math.floor((l.lv + 1) * 400 * (l.lv + 1.2));
            
            if(upBtn && upCost) {
                if(l.lv < 10) { 
                    upCost.innerText = `$${cost.toLocaleString()}`; 
                    upBtn.disabled = game.money < cost; 
                } else { 
                    upCost.innerText = "MAX"; 
                    upBtn.disabled = true; 
                }
            }
            
            // 更新耐久度 (Bar 與 文字)
            const durFill = document.getElementById(`dur-fill-${i}`);
            if(durFill) durFill.style.width = `${l.dur}%`;
            const durText = document.getElementById(`dur-text-${i}`);
            if(durText) durText.innerText = `${Math.floor(l.dur)}%`;
            
            // 維修按鈕狀態
            const repairBtn = document.getElementById(`repair-btn-${i}`);
            if(repairBtn) repairBtn.disabled = game.money < 30 || l.dur === 100;
            
            // 自動化按鈕樣式切換
            const ab = document.getElementById(`auto-btn-${i}`);
            if(ab) {
                if(l.hasAuto) { 
                    ab.innerText = l.isAuto ? `🤖 L${i}: 智能運行` : `🤖 L${i}: 停止`; 
                    ab.style.background = l.isAuto ? "#238636" : "#d29922"; 
                } else { 
                    ab.innerText = `部署 Line ${i} 自動化 ($500)`; 
                    ab.disabled = game.money < 500; 
                }
            }

            // 訂單渲染邏輯
            if (!l.orders || l.orders.length === 0) genOrders(i);
            if (typeof renderOrders === 'function') renderOrders(i);

            // 交付按鈕邏輯
            const deliverBtn = document.getElementById(`deliver-btn-${i}`);
            if (deliverBtn && l.selIdx !== -1 && l.orders[l.selIdx]) {
                const o = l.orders[l.selIdx]; 
                const can = game.inv[o.type] >= o.qty;
                deliverBtn.innerText = can ? `交付 ${o.qty} ${cfg[o.type].n}` : `材料不足`;
                deliverBtn.disabled = !can || l.proc;
            }
        }
    }
    
    // ✨ 更新科技樹按鈕狀態 (已解鎖則禁用)
    if(game.tech) {
        const techMap = { 
            autoRepair: 'tech-repair-btn', 
            overtime: 'tech-overtime-btn', 
            highOrder: 'tech-order-btn' 
        };
        Object.keys(techMap).forEach(key => {
            const btn = document.getElementById(techMap[key]);
            if(btn && game.tech[key]) {
                btn.innerText = "已解鎖";
                btn.disabled = true;
                btn.style.background = "#21262d";
                btn.style.color = "#8b949e";
            }
        });
    }
}

    // ⚡ 生產執行邏輯：處理訂單、扣除耐久及計算利潤
	// ⚡ 這個函數負責檢查資源、扣除消耗、啟動循環生產並結算利潤。
	async function processOrder(id) {
    // 獲取生產線對象；如果正在生產中 (l.proc) 或未選中訂單 (selIdx === -1)，則終止執行
    const l = game.lines[id]; if(l.proc || l.selIdx === -1) return;
    
    // 獲取當前選中的訂單對象；將生產線狀態設為「生產中」
    const o = l.orders[l.selIdx]; l.proc = true; 
    
    // 從全局庫存中扣除該訂單所需的原材料數量；更新 UI 顯示
    game.inv[o.type] -= o.qty; updateUI();
    
    // 建立數組，用來存放生產完成的零件 DOM 元素，方便後續清理
    const partsToClear = [];
    
    // 根據訂單要求的數量 (o.qty) 循環執行零件生產
    for(let i=1; i<=o.qty; i++) {
        // 調用 runPart 等待單個零件完成生產動畫與檢測，返回該零件的 DOM
        const p = await runPart(id, o.type, i);
        if (p) partsToClear.push(p); // 將完成的零件加入清理列表
        
        // 每次生產一個零件，生產線耐久度減少 2，最低不低於 0；更新 UI
        l.dur = Math.max(0, l.dur - 2); updateUI();
    }
    
	// 所有零件生產完成後，延遲 800 毫秒執行結算（模擬打包/交付感）
	setTimeout(() => {
        partsToClear.forEach(p => { if(p && p.remove) p.remove(); });
		
		// 確保獲取當前訂單資料
        const o = l.orders[l.selIdx];
        if (!o) return;
        
        // 1. 計算利潤 (高階訂單 1.5 倍利潤)
        const bonus = (o.isHigh) ? 1.5 : 1.0;
        const profit = Math.floor(o.qty * cfg[o.type].r * LINE_CONFIGS[id].m * (1 + currentPrestige.bonus) * bonus);
        game.money += profit;
        
        // 2. 增加研究點數
        game.researchPoints = (game.researchPoints || 0) + (o.isHigh ? 2 : 1);

        // 3. 計算損耗 (如果有 tech 且開啟加班)
        let wear = (2 + l.lv * 0.5);
        if (game.tech && game.tech.overtime) wear *= 2;
        l.dur = Math.max(0, l.dur - wear);

        // 4. 全自動維修
        if (game.tech && game.tech.autoRepair && l.dur < 20 && game.money >= 30) {
            game.money -= 30;
            l.dur = 100;
            if(typeof addLog === 'function') addLog(`🤖 Line ${id} 已觸發自動維修`, "#2ea043");
        }
		
		// ==========================================
        // ✨ 新增：客戶回饋邏輯 (加入在 setTimeout 此處)
        // ==========================================
		// 25% 機率觸發回饋
		let feedbackHTML = ""; // 用來存放顯示在方格內的文字
        if (Math.random() < 1.0) {
			const feedbackList = [
				{ msg: "「品質優良，下次再買！」", bonus: 0.2, color: "#3fb950" },
				{ msg: "「交貨準時，效率極高。」", bonus: 0.1, color: "#58a6ff" },
				{ msg: "「包裝完整，服務不錯。」", bonus: 0.05, color: "#bc8cff" }
			];
			
			// 25% 機率獲得客戶小費
            const f = feedbackList[Math.floor(Math.random() * feedbackList.length)];
            const extraTip = Math.floor(profit * f.bonus); // 根據該訂單利潤給小費
            game.money += extraTip;
			
			// 構建要顯示在貨物下面的一行小字
            feedbackHTML = `<div style="color:${f.color}; font-size:12px; margin-top:4px; font-style:italic;">
                ${f.msg} (+$${extraTip})
            </div>`;
            
            // 在日誌欄顯示客戶的聲音
			// 同時在日誌欄備份一份（可選）
            if (typeof addLog === 'function') 
				addLog(`💬 Line ${id}：${f.msg}`, f.color);
			}
       
        // ==========================================
		
		// 更新交付狀態文字（記得加入 feedbackHTML）
		const displayEl = document.getElementById(`delivery-info-${id}`);
        if (displayEl) {
            displayEl.innerHTML = `
                <span style="color:#3fb950; font-weight:bold;">✅ 成功交付!</span><br>
                <span style="color:#f2cc60">+$${profit}</span>
                ${feedbackHTML}
            `;
        }
		
        // 重新生成新訂單，重置生產線狀態為空閒，更新 UI
        genOrders(id); l.proc = false; l.selIdx = -1; updateUI(); 
    }, 800);
}


    // 📦 零件運動與 QA 檢測動畫：實現零件在輸送帶上的位移與質量判定
	// 📦 這個函數處理單個零件的動畫流程：
	// 📦 移動 -> 加工等待 -> QA 檢測 ->（若失敗則重走流程）-> 完成。
	async function runPart(lId, type, idx) {
    // 創建零件的 div 元素，根據類型賦予顏色類名，並顯示其序號
    const part = document.createElement('div');
    part.className = `part ${cfg[type].c}`; part.innerText = idx;
    
    // 設置零件初始位置（起點）
    part.style.left = "30px"; part.style.top = "80px";
    
    // 將零件添加到對應生產線的容器中
    document.getElementById(`line-group-${lId}`).appendChild(part);
    const qa = document.getElementById(`qa-status-${lId}`);
    
    // 短暫延遲確保 DOM 已渲染，然後移動零件到加工區 (270px)
    await new Promise(r => setTimeout(r, 50));
    part.style.left = "270px"; await new Promise(r => setTimeout(r, 600));

    // 使用死循環，直到零件通過 QA 檢測才會 return
    while(true) {
        // 計算加工速度：基礎時間隨等級 (lv) 降低，並受聲望 (Prestige) 加速加成
        let baseSpeed = (15 - (game.lines[lId].lv * 1.3));
        let timeSec = Math.max(0.5, baseSpeed * (1 - currentPrestige.speed));
        
        // 顯示進度條與倒計時文字
        const bar = document.getElementById(`prog-bar-${lId}`);
        document.getElementById(`prog-cont-${lId}`).style.visibility = 'visible';
        
        // 重置進度條動畫（先設為 none 瞬間回到 100%，再啟動 transition）
        bar.style.transition = 'none'; bar.style.width = '100%'; void bar.offsetWidth;
        bar.style.transition = `width ${timeSec}s linear`; bar.style.width = '0%';
        
        // 設置定時器更新 UI 上的剩餘秒數文字
        let rem = timeSec;
        const ti = setInterval(() => { 
            rem -= 0.1; 
            document.getElementById(`timer-text-${lId}`).innerText = `${Math.max(0, rem).toFixed(1)}s`; 
            if(rem <=0) clearInterval(ti); 
        }, 100);
        
        // 等待加工時間結束，隱藏進度條容器
        await new Promise(r => setTimeout(r, timeSec * 1000));
        document.getElementById(`prog-cont-${lId}`).style.visibility = 'hidden';
        
        // 將零件移至 QA 檢測區 (580px) 並更新狀態文字
        part.style.left = "580px"; 
        if(qa) { qa.innerText = "⚙️ 檢測中..."; qa.style.color = "#58a6ff"; }
        await new Promise(r => setTimeout(r, 600));

        // 計算失敗率：基礎 5% + (耐久度越低失敗率越高)，最後減去聲望加成
        let failChance = 0.05 + ((100 - game.lines[lId].dur)/200);
        let finalFailChance = Math.max(0, failChance - currentPrestige.qa);
        
        // 判定隨機數是否小於失敗率
        if(Math.random() < finalFailChance) {
            // 檢測失敗：更新文字為紅色，零件送回加工點 (270px)，重新循環 while 內容
            qa.innerText = "❌ 不合格"; qa.style.color = "#f85149";
            part.style.left = "270px"; await new Promise(r => setTimeout(r, 800));
        } else {
            // 檢測成功：更新文字為綠色，零件移至終點 (855px)
            qa.innerText = "✅ 合格"; qa.style.color = "#3fb950";
            part.style.left = "855px"; part.style.top = "85px";
            await new Promise(r => setTimeout(r, 600));
            
            // 返回零件 DOM 對象，跳出 while 循環，結束此零件的 runPart 函數
            return part;
        }
    }
}

            return id >= range[0] && id <= range[1];
        });

                isHigh = true;
                qty = Math.floor(qty * 2.5); // 難度提升

                type: randomType, 
                qty: qty,

            });

function renderOrders(id) {
    const list = document.getElementById(`order-list-${id}`); 
    if(!list) return;
    
    const line = game.lines[id];
    if (!line || !line.orders) return;

    // 取得畫面上現有的卡片數量
    const existingCards = list.getElementsByClassName('order-card');

    // ✨ 關鍵優化：如果畫面上卡片數量跟數據一樣，代表結構冇變，只更新內容，防止閃爍！
    if (existingCards.length === line.orders.length) {
        line.orders.forEach((o, idx) => {
            const d = existingCards[idx];
            if (!d) return;

            // 1. 重新計算利潤 (保持你原本的公式)
            const totalProfit = Math.floor(o.qty * cfg[o.type].r * LINE_CONFIGS[id].m * (1 + currentPrestige.bonus));
            
            // 2. 只更新入面的文字，唔會破壞 Hover 狀態
            const newHTML = `<b>${o.qty}x ${cfg[o.type].n}</b> <span style="float:right; color:#f2cc60">+$${totalProfit}</span>`;
            if (d.innerHTML !== newHTML) {
                d.innerHTML = newHTML;
            }

            // 3. 只切換選中狀態的 Class (selected)
            const isSelected = line.selIdx === idx;
            if (isSelected && !d.classList.contains('selected')) {
                d.classList.add('selected');
            } else if (!isSelected && d.classList.contains('selected')) {
                d.classList.remove('selected');
            }
        });
        return; // 搞定，直接退出，唔行下面嘅清空重砌邏輯！
    }

    // =============================================================
    // 只有當訂單數量變咗（例如新訂單生成），才會行下面原本嘅清空與新建邏輯
    // =============================================================
    list.innerHTML = '';
    
    line.orders.forEach((o, idx) => {
        const d = document.createElement('div'); 
        d.className = `order-card ${line.selIdx === idx ? 'selected' : ''}`;
        
        const totalProfit = Math.floor(o.qty * cfg[o.type].r * LINE_CONFIGS[id].m * (1 + currentPrestige.bonus));
        d.innerHTML = `<b>${o.qty}x ${cfg[o.type].n}</b> <span style="float:right; color:#f2cc60">+$${totalProfit}</span>`;
        
        d.onclick = () => { 
            if(!line.proc) { 
                line.selIdx = idx; 
                updateUI(); 
            } 
        };
        list.appendChild(d);
    });
}

	// ==========================================
    // 💾 1. 存檔與讀取系統 (確保結構完整)
    // ==========================================
    function saveGame() { 
        game.prices = JSON.parse(JSON.stringify(cfg));
        game.customPrestige = JSON.parse(JSON.stringify(PRESTIGE_LEVELS));
        localStorage.setItem('factory_v12_3_save', JSON.stringify(game)); 
        addLog("💾 系統自動存檔完成", "#58a6ff"); 
    }

    function loadGame() { 
        const s = localStorage.getItem('factory_v12_3_save'); 
        if(!s) { updateUI(); return; }
        try {
            const loaded = JSON.parse(s); 
            Object.assign(game, loaded);
            if(game.prices) cfg = JSON.parse(JSON.stringify(game.prices));
            if(game.customPrestige) PRESTIGE_LEVELS = JSON.parse(JSON.stringify(game.customPrestige));
            
            // 強制重置生產狀態，防止存檔卡死畫面
            if(game.lines) {
                for(let i=1; i<=LINE_COUNT; i++) {
                    if(game.lines[i]) game.lines[i].proc = false;
                }
            }
        } catch(e) { console.error("存檔損壞:", e); }
        updateUI(); 
    }

    function resetGame() { 
        if(confirm("確定重置嗎？數據將永久刪除。")) { 
            localStorage.clear(); 
            location.reload(); 
        } 
    }
	
	// ==========================================
    // 🤖 2. 自動化運行邏輯：自動挑選高利潤訂單並補貨
    // ==========================================
    async function autoCycle(id) {
        const l = game.lines[id]; 
        if (!l.orders || l.orders.length === 0) return;
        let bestIdx = 0; 
        let maxP = -1;
        
        // 尋找最高利潤訂單
        l.orders.forEach((o, idx) => {
            const p = o.qty * cfg[o.type].r;
            if(p > maxP) { maxP = p; bestIdx = idx; }
        });

        l.selIdx = bestIdx;
        const o = l.orders[l.selIdx];
        
        // 自動補貨機制
        if(game.inv[o.type] < o.qty) {
            const need = o.qty - game.inv[o.type];
            const cost = need * cfg[o.type].buy;
            if(game.money >= cost) {
                game.money -= cost;
                game.inv[o.type] += need;
                updateUI();
            } else { return; } // 錢不夠就等下次
        }
        
        // 執行交付
        if(game.inv[o.type] >= o.qty && !l.proc) {
            // 呼叫原本的 processOrder 函數
            if(typeof processOrder === 'function') processOrder(id);
        }
    }
	
	// ==========================================
    // 🚀 3. 唯一的啟動引擎 (嚴格順序)
    // ==========================================
    function startEngine() {
        try {
		
			console.log("Step 0: 生成動態庫存 UI...");
			renderInventoryUI(); // <--- 確保在所有邏輯開始前先畫出界面
		
            console.log("Step 1: 繪製工廠地面...");
            initFloor();   
            
            console.log("Step 2: 繪製商店區域...");
            renderShop();  
            
            console.log("Step 3: 載入玩家數據...");
            loadGame();    
            
            // 啟動主計時循環 (自動化檢查)
            setInterval(() => { 
				for(let i=1; i<=LINE_COUNT; i++) { 
                    if(game.unlocked[i] && game.lines[i] && game.lines[i].isAuto && !game.lines[i].proc) {
                        if(typeof autoCycle === 'function') autoCycle(i);
                    }
                } 
            }, 1500);

            // 每3分鐘自動存檔一次 , 1000 = 1秒
            setInterval(saveGame, 180000);
            
            console.log("✅ 遊戲所有系統啟動完成！");
        } catch (err) {
            console.error("❌ 啟動過程發生錯誤:", err);
            // 萬一出錯，至少顯示在遊戲日誌中
            if(typeof addLog === 'function') addLog("系統啟動異常: " + err.message, "#ff4d4d");
        }
    }

    // 啟動點 (整個檔案只會執行這一次)
    startEngine();
	
	// 🧪 研發實驗室購買邏輯 (加在檔案結尾即可)
    function buyTech(key, cost) {
        if (!game.tech) game.tech = { autoRepair: false, overtime: false, highOrder: false };
        if (game.researchPoints >= cost && !game.tech[key]) {
            game.researchPoints -= cost;
            game.tech[key] = true;
            if(typeof addLog === 'function') addLog(`🧪 研發成功！`, "#a371f7");
            updateUI();
            saveGame();
        } else if (game.researchPoints < cost) {
            if(typeof addLog === 'function') addLog("🚫 研究點數不足", "#ff4d4d");
        }
    }
// ==========================================
// [系統啟動層] window.onload 全域初始化
// 🛠️ 說明：當瀏覽器完全載入 HTML 與資源後，執行此區塊
// 放置位置：建議放在 JavaScript 檔案的最底部
// ==========================================
window.onload = function() {
    console.log("🚀 遊戲初始化啟動...");

    // 1. 執行介面初次渲染
    // 這會根據 renderDashboard() 內的模板畫出稱號、資金與資源格子
    if (typeof renderDashboard === 'function') {
        renderDashboard();
    } else {
        console.warn("⚠️ 找不到 renderDashboard 函數，請確保已添加該函數。");
    }

    // 2. 執行數據初次同步
    // 確保一開機就看到正確的稱號進度與數值
    if (typeof updateUI === 'function') {
        updateUI();
    }

    // 3. 啟動全域定時器 (每 100 毫秒刷新一次 UI)
    // 這樣你的金錢跳動、進度條增長才會平滑
    setInterval(() => {
        if (typeof updateUI === 'function') {
            updateUI();
        }
    }, 100);

    console.log("✅ 介面渲染與循環系統已就緒。");
};
// ==========================================
// [系統啟動層] 初始化結束
// ==========================================											 
</script>
